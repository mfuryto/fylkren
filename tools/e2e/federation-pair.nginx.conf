server {
    listen 443 ssl;
    ssl_certificate /test-tls/server.pem;
    ssl_certificate_key /test-tls/server.key;
    location / {
        proxy_pass http://web-a:8080;
        proxy_set_header Host localhost:18443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
server {
    listen 444 ssl;
    ssl_certificate /test-tls/server.pem;
    ssl_certificate_key /test-tls/server.key;
    location / {
        proxy_pass http://web-b:8080;
        proxy_set_header Host localhost:18444;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
server {
    listen 445 ssl;
    ssl_certificate /test-tls/server.pem;
    ssl_certificate_key /test-tls/server.key;
    location / {
        proxy_pass http://api-b-replica:8080;
        proxy_set_header Host localhost:18444;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
