server {
    listen 443 ssl;
    ssl_certificate /test-tls/server.pem;
    ssl_certificate_key /test-tls/server.key;
    location = /outbound/canary {
        access_log /var/log/nginx/outbound-canary.log combined;
        return 200 "SYNTHETIC_CANARY";
    }
    location = /outbound/redirect { return 302 https://tls/outbound/canary; }
    location = /outbound/large { alias /test-tls/outbound-large.json; }
    location = /outbound/webhook-large {
        error_page 405 =200 /outbound/large;
        alias /test-tls/outbound-large.json;
    }
    location / {
        proxy_pass http://web-a:8080;
        proxy_set_header Host localhost:18443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
server {
    listen 444 ssl;
    ssl_certificate /test-tls/server.pem;
    ssl_certificate_key /test-tls/server.key;
    location / {
        proxy_pass http://web-b:8080;
        proxy_set_header Host localhost:18444;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
server {
    listen 445 ssl;
    ssl_certificate /test-tls/server.pem;
    ssl_certificate_key /test-tls/server.key;
    location / {
        proxy_pass http://api-b-replica:8080;
        proxy_set_header Host localhost:18444;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen 446 ssl;
    ssl_certificate /test-tls/server.pem;
    ssl_certificate_key /test-tls/server.key;
    location / { alias /test-tls/outbound-large.json; }
}

server {
    listen 447 ssl;
    ssl_certificate /test-tls/server.pem;
    ssl_certificate_key /test-tls/server.key;
    location / { return 302 https://tls/outbound/canary; }
}

server {
    listen 448 ssl;
    ssl_certificate /test-tls/server.pem;
    ssl_certificate_key /test-tls/server.key;
    location / { access_log /var/log/nginx/outbound-canary.log combined; return 200 "SYNTHETIC_CANARY"; }
}

server {
    listen 449 ssl;
    ssl_certificate /test-tls/server.pem;
    ssl_certificate_key /test-tls/server.key;
    location / { alias /test-tls/outbound-small.json; }
}
