services:
  api:
    environment:
      SSL_CERT_FILE: /run/fylkren-identity-lab/ca.crt
      LDAPTLS_CACERT: /run/fylkren-identity-lab/ca.crt
      LDAPTLS_REQCERT: demand
      Fylkren__Authentication__DirectoryLifecycle__IntervalMinutes: 1
      Fylkren__Authentication__DirectoryLifecycle__MissingConfirmationCount: 3
      Fylkren__Authentication__Ldap__Enabled: "false"
      Fylkren__Authentication__Ldap__Server: ${FYLKREN_IDENTITY_LAB_IMPORTED_LDAP_SERVER:?Set imported LDAP server}
      Fylkren__Authentication__Ldap__Port: 636
      Fylkren__Authentication__Ldap__UseSsl: "true"
      Fylkren__Authentication__Ldap__UseStartTls: "false"
      Fylkren__Authentication__Ldap__BaseDn: dc=example,dc=test
      Fylkren__Authentication__Ldap__UserSearchBase: ou=people,dc=example,dc=test
      Fylkren__Authentication__Ldap__BindDn: cn=admin,dc=example,dc=test
      Fylkren__Authentication__Ldap__BindPassword: ${FYLKREN_IDENTITY_LAB_LDAP_ADMIN_PASSWORD:?Set LDAP administrator password}
      Fylkren__Authentication__Ldap__UsernameAttribute: uid
      Fylkren__Authentication__Ldap__DisplayNameAttribute: displayName
      Fylkren__Authentication__Ldap__EmailAttribute: mail
      Fylkren__Authentication__Ldap__StableIdAttribute: employeeNumber
      Fylkren__Authentication__Ldap__LifecycleActiveFilter: (employeeType=active)
    volumes:
      - ${FYLKREN_IDENTITY_LAB_DIR:?Set FYLKREN_IDENTITY_LAB_DIR}/ca.crt:/run/fylkren-identity-lab/ca.crt:ro

  ldap:
    image: osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
    command: ["--copy-service", "--loglevel", "warning"]
    environment:
      LDAP_ORGANISATION: Fylkren Identity Lab
      LDAP_DOMAIN: example.test
      LDAP_ADMIN_PASSWORD: ${FYLKREN_IDENTITY_LAB_LDAP_ADMIN_PASSWORD:?Set the disposable LDAP administrator password}
      LDAP_CONFIG_PASSWORD: ${FYLKREN_IDENTITY_LAB_LDAP_CONFIG_PASSWORD:?Set the disposable LDAP configuration password}
      LDAP_TLS: "true"
      LDAP_TLS_ENFORCE: "true"
      LDAP_TLS_VERIFY_CLIENT: never
      LDAP_TLS_CA_CRT_FILENAME: ca.crt
      LDAP_TLS_CRT_FILENAME: ldap.crt
      LDAP_TLS_KEY_FILENAME: ldap.key
    volumes:
      - ${FYLKREN_IDENTITY_LAB_DIR}/ca.crt:/container/service/slapd/assets/certs/ca.crt:ro
      - ${FYLKREN_IDENTITY_LAB_DIR}/ldap.crt:/container/service/slapd/assets/certs/ldap.crt:ro
      - ${FYLKREN_IDENTITY_LAB_DIR}/ldap.key:/container/service/slapd/assets/certs/ldap.key:ro
      - ${FYLKREN_IDENTITY_LAB_DIR}/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-fylkren-lab.ldif:ro
    expose:
      - "636"
    healthcheck:
      test: ["CMD-SHELL", "LDAPTLS_REQCERT=never ldapsearch -x -H ldaps://ldap:636 -D cn=admin,dc=example,dc=test -w $$LDAP_ADMIN_PASSWORD -b dc=example,dc=test -s base dn >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      backend:
        aliases: [ldap-wrong-name]

  transport-sink:
    image: node:24-alpine
    command: ["node", "tools/e2e/smtp-sink.mjs", "0.0.0.0", "2525", "2526", "0.0.0.0"]
    environment:
      FYLKREN_SMTP_CANARY_PORT: "1389"
      FYLKREN_SMTP_STALL_PORT: "2527"
      FYLKREN_SMTP_CERTIFICATE: /run/fylkren-identity-lab/smtp.crt
      FYLKREN_SMTP_PRIVATE_KEY: /run/fylkren-identity-lab/smtp.key
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./:/work:ro
      - ${FYLKREN_IDENTITY_LAB_DIR}/smtp.crt:/run/fylkren-identity-lab/smtp.crt:ro
      - ${FYLKREN_IDENTITY_LAB_DIR}/smtp.key:/run/fylkren-identity-lab/smtp.key:ro
    working_dir: /work
    networks: [backend]
