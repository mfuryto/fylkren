x-api-environment: &api-environment
  Fylkren__Http__TrustForwardedHeaders: "true"
  Fylkren__Http__ForwardedHeaderLimit: "2"
  Fylkren__Http__RequireHttps: "true"
  Fylkren__Federation__RetentionDays: "2555"
  Fylkren__Authentication__MfaEnabled: "false"
  Fylkren__License__PublicKeySpki: ${FYLKREN_PAIR_ISSUER_PUBLIC_KEY:?}
  Fylkren__Outbound__PrivateOrigins: https://tls:443;https://tls:444;https://tls:446;https://tls:447;https://tls:449
  SSL_CERT_FILE: /test-ca/ca.pem
  ASPNETCORE_ENVIRONMENT: ${FYLKREN_PAIR_ASPNETCORE_ENVIRONMENT:-FederationTest}

services:
  postgres-a:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fylkren
      POSTGRES_USER: fylkren
      POSTGRES_PASSWORD: synthetic-federation-only
    volumes:
      - database-a:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fylkren -d fylkren"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-b:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fylkren
      POSTGRES_USER: fylkren
      POSTGRES_PASSWORD: synthetic-federation-only
    volumes:
      - database-b:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fylkren -d fylkren"]
      interval: 3s
      timeout: 3s
      retries: 20

  api-a:
    image: fylkren-federation-pair-test-api:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    volumes:
      - ${FYLKREN_PAIR_TMP:?}/ca.pem:/test-ca/ca.pem:ro
      - keys-a:/var/lib/fylkren/keys
    depends_on:
      postgres-a:
        condition: service_healthy
    healthcheck: &api-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--header", "X-Forwarded-Proto: https", "http://localhost:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    environment:
      <<: *api-environment
      ConnectionStrings__Fylkren: Host=postgres-a;Database=fylkren;Username=fylkren;Password=synthetic-federation-only
      Fylkren__DataProtection__KeyPath: /var/lib/fylkren/keys
      Fylkren__PublicUrl: https://localhost:18443

  api-b:
    image: ${FYLKREN_PAIR_API_B_IMAGE:-fylkren-federation-pair-test-api:local}
    environment:
      <<: *api-environment
      ConnectionStrings__Fylkren: Host=postgres-b;Database=fylkren;Username=fylkren;Password=synthetic-federation-only
      Fylkren__DataProtection__KeyPath: /var/lib/fylkren/keys
      Fylkren__PublicUrl: https://localhost:18444
    volumes:
      - ${FYLKREN_PAIR_TMP:?}/ca.pem:/test-ca/ca.pem:ro
      - keys-b:/var/lib/fylkren/keys
    depends_on:
      postgres-b:
        condition: service_healthy
    healthcheck: *api-healthcheck

  api-b-replica:
    image: ${FYLKREN_PAIR_API_B_IMAGE:-fylkren-federation-pair-test-api:local}
    environment:
      <<: *api-environment
      ConnectionStrings__Fylkren: Host=postgres-b;Database=fylkren;Username=fylkren;Password=synthetic-federation-only
      Fylkren__DataProtection__KeyPath: /var/lib/fylkren/keys
      Fylkren__PublicUrl: https://localhost:18444
    volumes:
      - ${FYLKREN_PAIR_TMP:?}/ca.pem:/test-ca/ca.pem:ro
      - keys-b:/var/lib/fylkren/keys
    depends_on:
      api-b:
        condition: service_healthy
    healthcheck: *api-healthcheck

  web-a:
    image: fylkren-federation-pair-test-web:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    volumes:
      - ./federation-pair.web-a.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-a:
        condition: service_healthy
    healthcheck: &web-healthcheck
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  web-b:
    image: fylkren-federation-pair-test-web:local
    volumes:
      - ./federation-pair.web-b.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-b:
        condition: service_healthy
    healthcheck: *web-healthcheck

  tls:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:18443:443"
      - "127.0.0.1:18444:444"
      - "127.0.0.1:18445:445"
    volumes:
      - ./federation-pair.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FYLKREN_PAIR_TMP:?}/server.pem:/test-tls/server.pem:ro
      - ${FYLKREN_PAIR_TMP:?}/server.key:/test-tls/server.key:ro
      - ${FYLKREN_PAIR_TMP:?}/outbound-large.json:/test-tls/outbound-large.json:ro
      - ${FYLKREN_PAIR_TMP:?}/outbound-small.json:/test-tls/outbound-small.json:ro
    depends_on:
      web-a:
        condition: service_healthy
      web-b:
        condition: service_healthy
      api-b-replica:
        condition: service_healthy

volumes:
  database-a:
  database-b:
  keys-a:
  keys-b:
