services:
  smtp-sink:
    image: node:24-alpine
    command: ["node", "tools/e2e/smtp-sink.mjs", "0.0.0.0", "2525", "2526", "0.0.0.0"]
    environment:
      FYLKREN_SMTP_TRANSIENT_FAILURES: "1"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./:/work:ro
    working_dir: /work
    ports:
      - "127.0.0.1:19225:2526"
    networks:
      - frontend
