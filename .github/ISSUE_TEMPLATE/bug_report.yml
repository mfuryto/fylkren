name: Bug report
description: Report a reproducible non-security problem in Fylkren.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, customer data or security vulnerabilities. Follow SECURITY.md for confidential reports."
  - type: input
    id: version
    attributes:
      label: Fylkren version
      placeholder: "For example, 1.0.0"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, deployment type and relevant non-sensitive configuration.
