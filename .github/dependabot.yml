version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /apps/postgres
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 3
