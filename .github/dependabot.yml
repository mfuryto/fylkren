version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      npm-non-major:
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      nuget-non-major:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/data-protection-custody
      - /apps/postgres
      - /apps/tls-init
      - /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      container-images:
        patterns: ["*"]
