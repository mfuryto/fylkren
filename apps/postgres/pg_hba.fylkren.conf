# Local maintenance commands run inside the database container.
local   all             all                                     trust

# Application traffic must use TLS and the installation-specific API client
# certificate. Reject plaintext explicitly so clients cannot downgrade.
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
hostssl  all            fylkren         0.0.0.0/0               cert clientcert=verify-full map=fylkren_api
hostssl  all            fylkren         ::/0                    cert clientcert=verify-full map=fylkren_api
