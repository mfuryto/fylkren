# Local maintenance commands run inside the database container.
local   all             all                                     trust

# Application traffic must use TLS and password authentication. Reject a
# plaintext attempt explicitly so clients cannot downgrade or fall back.
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
hostssl  all            all             0.0.0.0/0               scram-sha-256
hostssl  all            all             ::/0                    scram-sha-256
